seed: 42

data:
  observed_fits: storage/M31/m31bH100_trim.fits
  ideal_fits: storage/M31/m31bH100.fits
  out_dir: storage/patches/baseline
  patch_size: 64
  stride: 64           # non-overlapping patches
  observed_normalize: asinh   # asinh | log | linear
  ideal_normalize: asinh      # sparse point-source field; asinh keeps faint-source dynamic range
  asinh_softening: 3.0
  split_block_size: 505  # 4040 / 505 = 8 blocks per axis -> 64 blocks
  val_fraction: 0.2

model:
  name: espcn
  channels: 64

train:
  out_dir: storage/runs/baseline
  epochs: 50
  batch_size: 64
  lr: 1.0e-3
  loss: l1
  num_workers: 2
  device: auto
